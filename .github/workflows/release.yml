# File release.yml
name: Release Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine version bump
        id: bump
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tag found. Defaulting to minor bump."
            echo "bump=minor" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s%n%b")

          if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\(.+\))?!:|BREAKING CHANGE:'; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE '^fix(\(.+\))?:'; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "No release-relevant commits since $LATEST_TAG. Skipping release."
            echo "bump=none" >> $GITHUB_OUTPUT
          fi

      - name: Compute version
        id: version
        if: steps.bump.outputs.bump != 'none'
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ steps.bump.outputs.bump }}" in
            major)
              NEW_VERSION="$((MAJOR+1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR+1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
              ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $NEW_VERSION (bump: ${{ steps.bump.outputs.bump }})"

      - name: Build and Test
        if: steps.bump.outputs.bump != 'none'
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build

      - name: Create Release Branch and Push
        if: steps.bump.outputs.bump != 'none'
        run: |
          BRANCH_NAME="release/${{ steps.version.outputs.version }}"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME --force

      - name: Create Git Tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create PR to main
        if: steps.bump.outputs.bump != 'none'
        run: |
          gh pr create \
            --base main \
            --head release/${{ steps.version.outputs.version }} \
            --title "chore(release): v${{ steps.version.outputs.version }}" \
            --body "🚀 **Automatic Release**

            - **Version:** ${{ steps.version.outputs.version }}
            - **Bump type:** ${{ steps.bump.outputs.bump }}
            - **Source:** ${{ github.ref_name }}

            Build and tests passed successfully. Ready for merge to main."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}